<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お迎え記録 | BLUE MOUSE</title>
  <!-- 本番HPと同じフォント。和文=Zen Maru Gothic（丸ゴシック）／数字・英字=Inter。
       Zen Maru Gothic は 400/500/700 のみで 800 は無いため、太字は 700 までにする -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/dist/face-api.js"></script>
  <style>
    /* 本番HP（child.html＝児童発達支援ページ）と同じ値を使う。
       この画面は児童発達支援の入退室で使うため、目印はイエロー系。
       放課後等デイのテーマカラーは使わず、ティールはロゴ色としての差し色のみ。 */
    :root {
      --bm-coral: #f2906c;        /* 行動色（CTA）。サービス固有の色ではない */
      --bm-coral-dark: #e87e59;
      --bm-teal: #5fc1c7;         /* ロゴ色 */
      --bm-yellow: #f5d24a;       /* 児童発達支援の目印 */
      --bm-yellow-dark: #d9a520;
      --bm-yellow-light: #fef9e7;
      --bm-yellow-ink: #6b4f08;   /* 黄色の上に乗せる文字色（白は使わない） */
      --bm-cream: #fffdf7;
      --bm-ink: 51, 37, 26;        /* 本文の文字色。HPの --ink #33251a と同値 */
      /* 暗色の面（ヘッダー・カメラ枠・サンクス画面）。HPのフッターと同じ #1e2a2c。
         文字色とは別に持つ。カメラ映像に色被りしないよう寒色ニュートラルにしている */
      --bm-surface: 30, 42, 44;
      /* ヘッダーの高さとロゴの比率はHPのヘッダー（60px帯／32pxロゴ＝約53%）に合わせる。
         据え置きタブレットを離れて見るため、比率は保ったままひと回り大きくしている。
         帯の高さは #clockScreen の padding-top と必ず一致させる必要があるので変数で1本化 */
      --topbar-h: 76px;
      --topbar-logo-h: 40px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* 本番HPのbodyと同じ設定 */
    body {
      font-family: "Zen Maru Gothic", "Zen Kaku Gothic New", sans-serif;
      background: var(--bm-cream); color: rgb(var(--bm-ink));
      line-height: 1.75; -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* Topbar */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: var(--topbar-h);
      background: rgba(var(--bm-surface), 0.97);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center; padding: 0 16px; z-index: 50;
    }
    .topbar-logo { height: var(--topbar-logo-h); width: auto; display: block; }

    /* 画面が低い端末（スマホ・横向き）では帯を元の高さに戻し、
       時計からお迎え完了ボタンまでが1画面に収まることを優先する */
    @media (max-height: 720px) {
      :root { --topbar-h: 52px; --topbar-logo-h: 30px; }
    }

    /* Clock Screen */
    #clockScreen { padding-top: var(--topbar-h); min-height: 100vh; display: flex; flex-direction: column; align-items: center; background: var(--bm-cream); }
    .clock-time-section { text-align: center; padding: 18px 20px 14px; }
    /* 数字はHPと同じく Inter。line-height はbodyの1.75だと行間が空きすぎるので詰める */
    .clock-time { font-family: "Inter", sans-serif; font-size: 56px; font-weight: 300; letter-spacing: 4px; line-height: 1.15; color: rgb(var(--bm-ink)); }
    .clock-date { font-size: 20px; line-height: 1.4; color: rgba(var(--bm-ink), 0.5); margin-top: 6px; }
    /* 「日」の前の数字だけロゴ色。周りが50%の薄い文字なので、埋もれないよう太さも上げる */
    .clock-day-num { color: var(--bm-teal); font-weight: 700; }
    /* 児童発達支援の目印（HPの見出し装飾と同じ考え方の細いイエロー線） */
    .clock-time-section::after { content: ''; display: block; width: 36px; height: 2px; margin: 12px auto 0; background: var(--bm-yellow); border-radius: 2px; }

    .camera-wrapper { position: relative; width: min(460px, 88vw); border-radius: 20px; overflow: hidden; background: rgb(var(--bm-surface)); box-shadow: 0 4px 32px rgba(var(--bm-ink),0.18); }
    #video { width: 100%; display: block; border-radius: 18px; }
    /* ヘッダーと同じ面の色に揃える（黒の被せ物だと帯だけ沈んで見えるため） */
    .camera-status { text-align: center; padding: 10px 16px; font-size: 13px; color: rgba(255,255,255,0.55); background: rgb(var(--bm-surface)); }
    .face-detecting { color: var(--bm-yellow); }
    .face-recognized { color: var(--bm-teal); }

    #profileCard {
      display: none; width: min(460px, 88vw); background: white;
      border: 1.5px solid rgba(var(--bm-ink),0.08); border-radius: 18px; padding: 16px; margin-top: 16px;
      flex-direction: column; gap: 14px;
      box-shadow: 0 2px 16px rgba(var(--bm-ink),0.08); animation: slideIn 0.3s ease;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .profile-row { display: flex; align-items: center; gap: 14px; }
    #parentPhotoEl { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .profile-info { flex: 1; }
    .profile-name { font-size: 18px; font-weight: 700; color: rgb(var(--bm-ink)); }
    .profile-child-name { font-size: 13px; color: rgba(var(--bm-ink),0.5); margin-top: 2px; }
    .auth-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(95,193,199,0.12); border: 1px solid rgba(95,193,199,0.35); color: #3aa8ae; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; margin-top: 6px; }

    /* 子供写真エリア */
    #childPhotoArea {
      display: none;
      align-items: center; gap: 12px;
      background: var(--bm-yellow-light); border-radius: 12px;
      padding: 10px 14px;
      border: 1px solid rgba(217,165,32,0.22);
    }
    #childPhotoEl { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; border: 2px solid rgba(217,165,32,0.42); flex-shrink: 0; }
    /* HPの児発ページのラベル帯と同じ（イエロー地＋濃茶文字） */
    .child-label { display: inline-block; font-size: 11px; font-weight: 700; color: var(--bm-yellow-ink); background: var(--bm-yellow); padding: 2px 9px; border-radius: 100px; letter-spacing: 0.06em; margin-bottom: 4px; }
    .child-name-text { font-size: 15px; font-weight: 700; color: rgb(var(--bm-ink)); }

    /* ボタンの上の一言。来所／退所で文言が変わる。
       文言が無いとき（未認証・来所時）は要素ごと畳んで余白を残さない */
    .action-lead {
      width: min(460px, 88vw); margin-top: 14px; text-align: center;
      font-size: 15px; font-weight: 500; line-height: 1.6;
      color: rgba(var(--bm-ink), 0.62);
    }
    .action-lead:empty { display: none; }
    /* 退所はモーダルが無いので、失敗時はここをエラー表示に使う */
    .action-lead.is-error { color: #c0453f; font-weight: 700; }
    .action-buttons { display: flex; width: min(460px, 88vw); margin-top: 10px; }
    .btn-pickup {
      flex: 1; padding: 22px; border-radius: 16px; border: none;
      font-size: 20px; font-weight: 700; cursor: pointer; letter-spacing: 0.03em;
      background: linear-gradient(135deg, var(--bm-coral), var(--bm-coral-dark));
      color: white; box-shadow: 0 4px 20px rgba(242,144,108,0.38);
      transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s;
    }
    .btn-pickup:disabled { opacity: 0.22; cursor: not-allowed; transform: none !important; }
    .btn-pickup:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(242,144,108,0.48); }
    .btn-pickup:not(:disabled):active { transform: translateY(0); }

    /* Thanks Screen */
    #thanksScreen {
      display: none; min-height: 100vh; align-items: center; justify-content: center;
      flex-direction: column; text-align: center; padding: 40px 20px;
      background: rgb(var(--bm-surface)); position: relative; overflow: hidden;
    }
    #thanksScreen::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 38%, rgba(95,193,199,0.22) 0%, transparent 62%);
      pointer-events: none;
    }
    .thanks-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 2px; padding: 6px 18px; border-radius: 999px; margin-bottom: 32px; background: rgba(95,193,199,0.15); border: 1px solid rgba(95,193,199,0.4); color: var(--bm-teal); text-transform: uppercase; }
    .thanks-photo-wrap { position: relative; width: 148px; height: 148px; margin: 0 auto 28px; }
    .thanks-photo { width: 136px; height: 136px; border-radius: 50%; object-fit: cover; border: 4px solid rgba(255,255,255,0.15); position: absolute; top: 6px; left: 6px; }
    .thanks-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(95,193,199,0.65); animation: ring-expand 2s ease-out infinite; }
    @keyframes ring-expand { 0%{transform:scale(.88);opacity:0} 30%{opacity:1} 100%{transform:scale(1.12);opacity:0} }
    .thanks-name { font-size: 32px; font-weight: 700; color: var(--bm-cream); margin-bottom: 6px; }
    .thanks-child { font-size: 15px; color: rgba(255,255,255,0.45); margin-bottom: 10px; }
    .thanks-message { font-size: 17px; color: rgba(255,255,255,0.55); margin-bottom: 28px; font-weight: 500; }
    .thanks-time { font-size: 13px; color: rgba(255,255,255,0.28); letter-spacing: 0.5px; }
    .thanks-bar { width: 180px; height: 2px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 36px; overflow: hidden; }
    .thanks-bar-fill { height: 100%; width: 0%; background: var(--bm-teal); border-radius: 2px; transition: width 5s linear; }

    /* Loading */
    #loadingOverlay { position: fixed; inset: 0; background: rgb(var(--bm-surface)); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; z-index: 999; }
    .loading-spinner { width: 48px; height: 48px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--bm-coral); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: rgba(255,255,255,0.4); }

    /* Checklist Modal */
    #checklistOverlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      align-items: center; justify-content: center; z-index: 200; padding: 20px;
      backdrop-filter: blur(4px);
    }
    #checklistOverlay.show { display: flex; }
    .checklist-modal {
      background: var(--bm-cream); border-radius: 24px; width: min(420px, 95vw);
      overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      animation: modalIn 0.25s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes modalIn { from { opacity:0; transform:scale(0.88) translateY(20px); } to { opacity:1; transform:none; } }
    .checklist-header {
      background: linear-gradient(135deg, #f8db63 0%, var(--bm-yellow) 100%);
      padding: 20px 24px; color: var(--bm-yellow-ink);
    }
    .checklist-header-top { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
    .checklist-parent-photo { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(107,79,8,0.25); flex-shrink: 0; }
    .checklist-name { font-size: 17px; font-weight: 700; }
    .checklist-child { font-size: 13px; opacity: 0.75; margin-top: 2px; }
    .checklist-subtitle { font-size: 13px; opacity: 0.8; margin-top: 10px; }
    .checklist-body { padding: 20px 24px; }
    .checklist-error {
      display: none; font-size: 14px; line-height: 1.6; color: #c0453f;
      background: rgba(192,69,63,0.07); border: 1px solid rgba(192,69,63,0.22);
      border-radius: 12px; padding: 12px 14px; margin-bottom: 16px;
    }
    .checklist-error.show { display: block; }
    .checklist-items { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .checklist-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; border-radius: 14px; cursor: pointer;
      border: 2px solid rgba(var(--bm-ink),0.08); background: white;
      transition: border-color 0.2s, background 0.2s;
      user-select: none;
    }
    .checklist-item.checked {
      border-color: var(--bm-teal); background: rgba(95,193,199,0.07);
    }
    .checklist-check {
      width: 26px; height: 26px; border-radius: 8px; border: 2.5px solid rgba(var(--bm-ink),0.2);
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      font-size: 15px; transition: all 0.2s;
    }
    .checklist-item.checked .checklist-check {
      background: var(--bm-teal); border-color: var(--bm-teal); color: white;
    }
    /* チェック印はCSSで出す（HTML側の要素は空のため、これが無いと塗られた四角のままになる） */
    .checklist-item.checked .checklist-check::after { content: '✓'; font-size: 16px; font-weight: 700; line-height: 1; }
    .checklist-item-text { font-size: 16px; font-weight: 600; color: rgb(var(--bm-ink)); }
    /* これは「済んだ作業」ではなく保護者の申告なので、取り消し線や文字を薄くする表現は使わない。
       チェック済みは枠・背景・チェック印だけで示す */
    .checklist-item.checked .checklist-item-text { color: rgb(var(--bm-ink)); font-weight: 700; }
    .checklist-progress { font-size: 12px; color: rgba(var(--bm-ink),0.4); text-align: right; margin-bottom: 14px; }
    .checklist-actions { display: flex; gap: 10px; }
    .btn-checklist-cancel {
      flex: 1; padding: 14px; border-radius: 12px; border: 2px solid rgba(var(--bm-ink),0.12);
      background: white; color: rgba(var(--bm-ink),0.6); font-size: 15px; font-weight: 600; cursor: pointer;
      transition: background 0.2s;
    }
    .btn-checklist-cancel:hover { background: rgba(var(--bm-ink),0.04); }
    .btn-checklist-confirm {
      flex: 2; padding: 14px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, var(--bm-coral), var(--bm-coral-dark));
      color: white; font-size: 15px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 16px rgba(242,144,108,0.35);
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-checklist-confirm:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }
    .btn-checklist-confirm:not(:disabled):hover { transform: translateY(-1px); }

    /* ── 横長画面（MacBook Air M1＝1440×810想定）のレイアウト ──
       縦積みのままだと左右が大きく余り、カメラも小さいままになる。
       左にカメラを大きく、右に時計・保護者情報・ボタンを縦に並べる2カラムにする。
       DOMの順序は変えずCSS Gridの配置だけで組んでいる（JS側に影響を出さないため） */
    @media (min-width: 1000px) {
      #clockScreen {
        display: grid;
        grid-template-columns: auto minmax(360px, 420px);
        /* 上下の 1fr が余白を吸収する。これが無いと、保護者カードが非表示のときに
           時計とボタンがカメラの高さいっぱいに引き離されて間延びする */
        grid-template-rows: 1fr auto auto auto auto 1fr;
        align-content: center; justify-content: center;
        column-gap: 44px;
        padding: calc(var(--topbar-h) + 20px) 40px 20px;
      }
      /* カメラは左カラムで全行にまたがり、上下中央 */
      .camera-wrapper { grid-column: 1; grid-row: 1 / -1; width: min(620px, 46vw); align-self: center; }
      /* 右カラムは情報の列として左揃えにし、3つでひとかたまりに見せる */
      .clock-time-section { grid-column: 2; grid-row: 2; text-align: left; padding: 0 0 18px; }
      .clock-time-section::after { margin-left: 0; margin-right: auto; }
      #profileCard { grid-column: 2; grid-row: 3; width: 100%; margin-top: 0; }
      .action-lead { grid-column: 2; grid-row: 4; width: 100%; margin-top: 16px; }
      .action-buttons { grid-column: 2; grid-row: 5; width: 100%; margin-top: 10px; }
    }
  </style>
</head>
<body>

<div id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">起動中...</div>
</div>

<div class="topbar">
  <img src="logo.webp" alt="BLUE MOUSE" class="topbar-logo">
</div>

<!-- お迎え画面 -->
<div id="clockScreen">
  <div class="clock-time-section">
    <div class="clock-time" id="clockTime">--:--:--</div>
    <div class="clock-date" id="clockDate"></div>
  </div>
  <div class="camera-wrapper">
    <video id="video" autoplay muted playsinline></video>
    <div class="camera-status" id="cameraStatus">カメラを起動中...</div>
  </div>
  <div id="profileCard">
    <!-- 保護者行 -->
    <div class="profile-row">
      <img id="parentPhotoEl" src="" alt="">
      <div class="profile-info">
        <div class="profile-name" id="parentNameEl"></div>
        <div class="profile-child-name" id="parentRelLabel"></div>
        <div class="auth-badge">✓ 顔認証完了</div>
      </div>
    </div>
    <!-- 子供行 -->
    <div id="childPhotoArea">
      <img id="childPhotoEl" src="" alt="">
      <div>
        <div class="child-label">お子様</div>
        <div class="child-name-text" id="childNameEl"></div>
      </div>
    </div>
  </div>
  <p class="action-lead" id="actionLead"></p>
  <div class="action-buttons">
    <button class="btn-pickup" id="btnPickup" disabled onclick="recordPickup()">記録する</button>
  </div>
</div>

<!-- チェックリストモーダル -->
<div id="checklistOverlay">
  <div class="checklist-modal">
    <div class="checklist-header">
      <div class="checklist-header-top">
        <img class="checklist-parent-photo" id="checklistPhoto" src="" alt="">
        <div>
          <div class="checklist-name" id="checklistName"></div>
          <div class="checklist-child" id="checklistChild"></div>
        </div>
      </div>
      <div class="checklist-subtitle">お迎え前に以下の項目をご確認ください</div>
    </div>
    <div class="checklist-body">
      <div class="checklist-error" id="checklistError"></div>
      <div class="checklist-progress" id="checklistProgress">0 / 1 完了</div>
      <ul class="checklist-items" id="checklistItems">
        <li class="checklist-item" onclick="toggleCheck(this)">
          <div class="checklist-check"></div>
          <div class="checklist-item-text">🌡️ こどもの体温は37.5℃以下でした</div>
        </li>
      </ul>
      <div class="checklist-actions">
        <button class="btn-checklist-cancel" onclick="closeChecklist()">キャンセル</button>
        <button class="btn-checklist-confirm" id="btnConfirmPickup" disabled onclick="confirmPickup()">✓ お迎え完了</button>
      </div>
    </div>
  </div>
</div>

<!-- サンクス画面 -->
<div id="thanksScreen">
  <div class="thanks-badge">✓ &nbsp;お迎え記録完了</div>
  <div class="thanks-photo-wrap">
    <div class="thanks-ring"></div>
    <img class="thanks-photo" id="thanksPhoto" src="" alt="">
  </div>
  <div class="thanks-name" id="thanksName"></div>
  <div class="thanks-child" id="thanksChild"></div>
  <div class="thanks-message">お迎えありがとうございます！</div>
  <div class="thanks-time" id="thanksTime"></div>
  <div class="thanks-bar"><div class="thanks-bar-fill" id="thanksBar"></div></div>
</div>

<script>
const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';
const firebaseConfig = {
  apiKey: "AIzaSyAxkP1UP8UQffk8PxMp1_PUKNYaqo63QfU",
  authDomain: "bluemouse-dfd31.firebaseapp.com",
  projectId: "bluemouse-dfd31",
  storageBucket: "bluemouse-dfd31.firebasestorage.app",
  messagingSenderId: "244172125496",
  appId: "1:244172125496:web:117e6c1aeeaa056ba2bdcd"
};

let db, currentParent = null, labeledDescriptors = [], detectionTimer = null, lastFaceTime = 0;
// チェックリストを開いた時点の保護者を保持（表示中に顔がカメラから外れても記録できるように）
let checklistParent = null, isSubmitting = false;

// 同じ保護者の当日1回目を来所、2回目以降を退所として自動判定する。
// 判定に使う当日の件数は端末内に持つ（この端末1台での運用が前提）。
// 起動時に1度読み込み、記録するたびに加算、日付が変わったら読み直す。
let todayKey = '', todayVisitCounts = {}, isLoadingVisits = false;

// 来所／退所それぞれの文言。ここを直せば画面の言い回しが全て変わる
const VISIT_COPY = {
  arrival: {
    lead: '',
    button: '来所を記録する',
    checklistSubtitle: 'ご利用前に以下の項目をご確認ください',
    checklistConfirm: '✓ 来所を記録する',
    thanksBadge: '✓  来所を記録しました',
    thanksMessage: 'いってらっしゃい！'
  },
  departure: {
    lead: 'お迎えありがとうございます',
    button: '退所を記録する',
    // 退所は検温などの確認事項が無いためチェックリストを出さず、
    // ボタンを押した時点でそのまま記録する（checklist系の文言は持たない）
    thanksBadge: '✓  退所を記録しました',
    thanksMessage: 'お気をつけてお帰りください'
  }
};

function localDateKey(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

async function loadTodayVisits() {
  if (isLoadingVisits) return;
  isLoadingVisits = true;
  try {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    const snap = await db.collection('pickupRecords').where('timestamp', '>=', start).get();
    const counts = {};
    snap.forEach(doc => {
      const id = doc.data().parentId;
      if (id) counts[id] = (counts[id] || 0) + 1;
    });
    todayVisitCounts = counts;
    todayKey = localDateKey();
  } finally {
    isLoadingVisits = false;
  }
}

// 日付をまたいだら当日分を読み直す（端末は起動しっぱなしのため）
async function ensureTodayVisits() {
  if (todayKey !== localDateKey()) {
    try { await loadTodayVisits(); } catch (e) { console.error(e); }
  }
}

function visitTypeFor(parentId) {
  return (todayVisitCounts[parentId] || 0) === 0 ? 'arrival' : 'departure';
}

window.addEventListener('load', async () => {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  startClock('clockTime', 'clockDate');
  document.getElementById('loadingText').textContent = '顔認証モデルを読み込み中...';
  await waitForFaceApi();
  try {
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]);
  } catch(e) { console.error(e); }
  document.getElementById('loadingOverlay').style.display = 'none';
  startCamera();
});

function waitForFaceApi() {
  return new Promise(resolve => { const c = () => { if (window.faceapi) resolve(); else setTimeout(c, 100); }; c(); });
}

function startClock(tId, dId) {
  const update = () => {
    const jst = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Tokyo' }));
    const pad = n => String(n).padStart(2,'0');
    const tEl = document.getElementById(tId), dEl = document.getElementById(dId);
    if (tEl) tEl.textContent = `${pad(jst.getHours())}:${pad(jst.getMinutes())}:${pad(jst.getSeconds())}`;
    // 「日」の前の数字だけロゴ色にするため、そこだけspanで囲む
    if (dEl) { const days=['日','月','火','水','木','金','土']; dEl.innerHTML = `${jst.getFullYear()}年${jst.getMonth()+1}月<span class="clock-day-num">${jst.getDate()}</span>日（${days[jst.getDay()]}）`; }
  };
  update(); setInterval(update, 1000);
}

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
    const v = document.getElementById('video'); v.srcObject = stream; await v.play();
  } catch(e) {
    console.error(e); setStatus('カメラにアクセスできません', ''); return;
  }
  setStatus('保護者の顔をカメラに向けてください', 'detecting');
  try {
    await loadParentDescriptors();
  } catch(e) {
    console.error(e); setStatus('保護者データを読み込めませんでした', ''); return;
  }
  // 来所／退所の判定に使う当日分。失敗しても認証自体は続行させる
  try { await loadTodayVisits(); } catch(e) { console.error(e); }
  setInterval(ensureTodayVisits, 60000);
  startDetection();
}

async function loadParentDescriptors() {
  const snap = await db.collection('parents').get();
  labeledDescriptors = [];
  snap.forEach(doc => { const d = doc.data(); if (d.faceDescriptor?.length) labeledDescriptors.push({ id: doc.id, name: d.name, childName: d.childName || '', photo: d.photoBase64 || '', childPhoto: d.childPhotoBase64 || '', descriptor: new Float32Array(d.faceDescriptor) }); });
}

function startDetection() {
  if (detectionTimer) clearInterval(detectionTimer);
  const v = document.getElementById('video');
  detectionTimer = setInterval(async () => {
    if (!v.videoWidth) return;
    try {
      const det = await faceapi.detectSingleFace(v, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 })).withFaceLandmarks().withFaceDescriptor();
      if (!det) { if (currentParent && Date.now() - lastFaceTime > 1500) hideProfile(); if (!currentParent) setStatus('保護者の顔をカメラに向けてください', 'detecting'); return; }
      lastFaceTime = Date.now();
      if (!labeledDescriptors.length) { setStatus('保護者が未登録です', ''); return; }
      let best = null, bd = Infinity;
      for (const p of labeledDescriptors) { const d = faceapi.euclideanDistance(det.descriptor, p.descriptor); if (d < bd) { bd = d; best = p; } }
      if (bd < 0.5) { if (!currentParent || currentParent.id !== best.id) showProfile(best); }
      else { if (currentParent) hideProfile(); setStatus('登録されていない方です', 'detecting'); }
    } catch(e) { console.error(e); }
  }, 600);
}

function setStatus(msg, cls) {
  const el = document.getElementById('cameraStatus');
  el.textContent = msg; el.className = 'camera-status';
  if (cls === 'recognized') el.classList.add('face-recognized');
  if (cls === 'detecting') el.classList.add('face-detecting');
}

function showProfile(parent) {
  currentParent = parent;
  document.getElementById('parentNameEl').textContent = parent.name;
  document.getElementById('parentRelLabel').textContent = parent.childName ? `${parent.childName}の保護者` : '';
  document.getElementById('parentPhotoEl').src = parent.photo || generateAvatar(parent.name);

  // 子供写真
  const childArea = document.getElementById('childPhotoArea');
  if (parent.childName) {
    document.getElementById('childNameEl').textContent = parent.childName;
    const childPhotoEl = document.getElementById('childPhotoEl');
    if (parent.childPhoto) {
      childPhotoEl.src = parent.childPhoto;
    } else {
      childPhotoEl.src = generateAvatar(parent.childName);
    }
    childArea.style.display = 'flex';
  } else {
    childArea.style.display = 'none';
  }

  // 当日1回目なら来所、2回目以降なら退所として文言を切り替える
  const copy = VISIT_COPY[visitTypeFor(parent.id)];
  const lead = document.getElementById('actionLead');
  lead.textContent = copy.lead;
  lead.classList.remove('is-error');
  document.getElementById('btnPickup').textContent = copy.button;

  document.getElementById('profileCard').style.display = 'flex';
  document.getElementById('btnPickup').disabled = false;
  setStatus(`✓ ${parent.name}さんを認証しました`, 'recognized');
}

function hideProfile() {
  // 記録の書き込み中は画面をそのままにする（顔が外れても処理は続いている）
  if (isSubmitting) return;
  currentParent = null;
  document.getElementById('profileCard').style.display = 'none';
  document.getElementById('childPhotoArea').style.display = 'none';
  const lead = document.getElementById('actionLead');
  lead.textContent = ''; lead.classList.remove('is-error');
  document.getElementById('btnPickup').disabled = true;
}

function generateAvatar(name) {
  const c = name ? name.charAt(0) : '?';
  return `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="%23f2906c"/><text x="50" y="65" text-anchor="middle" font-size="40" fill="%23fffdf7">${encodeURIComponent(c)}</text></svg>`;
}

const ERROR_MESSAGE = '記録できませんでした。通信状況をご確認のうえ、もう一度お試しください。';

// 記録の書き込み本体。失敗時は例外をそのまま投げ、呼び出し側で画面に出す
async function submitVisit(parent) {
  const photo = capturePhoto();
  const jst = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Tokyo' }));
  // type は今回から追加した項目。これが無い過去の記録は「退所（お迎え）」として扱う
  await db.collection('pickupRecords').add({
    parentId: parent.id, parentName: parent.name, childName: parent.childName || '',
    type: parent.visitType, timestamp: firebase.firestore.FieldValue.serverTimestamp(), photoBase64: photo
  });
  // 次に同じ人が来たら退所と判定されるよう、端末内の当日件数を進める
  todayVisitCounts[parent.id] = (todayVisitCounts[parent.id] || 0) + 1;
  return jst;
}

function recordPickup() {
  if (!currentParent || isSubmitting) return;
  // 認証済みの保護者を確定させる（この後カメラから顔が外れても記録できる）
  const parent = { ...currentParent };
  // 来所か退所かもこの時点で確定させる（記録するまでの間に他の人が記録しても揺れないように）
  parent.visitType = visitTypeFor(currentParent.id);

  // 退所は確認事項が無いので、チェックリストを挟まずそのまま記録する
  if (parent.visitType === 'departure') { recordDirect(parent); return; }

  checklistParent = parent;
  const copy = VISIT_COPY[parent.visitType];
  document.querySelector('.checklist-subtitle').textContent = copy.checklistSubtitle;
  document.getElementById('btnConfirmPickup').textContent = copy.checklistConfirm;
  document.getElementById('checklistPhoto').src = checklistParent.photo || generateAvatar(checklistParent.name);
  document.getElementById('checklistName').textContent = checklistParent.name + ' さん';
  document.getElementById('checklistChild').textContent = checklistParent.childName ? `お子様：${checklistParent.childName}` : '';
  // チェックとエラー表示をリセット
  document.querySelectorAll('#checklistItems .checklist-item').forEach(item => item.classList.remove('checked'));
  document.getElementById('checklistError').classList.remove('show');
  updateChecklistProgress();
  document.getElementById('checklistOverlay').classList.add('show');
}

function toggleCheck(item) {
  item.classList.toggle('checked');
  updateChecklistProgress();
}

function updateChecklistProgress() {
  const items = document.querySelectorAll('#checklistItems .checklist-item');
  const checked = document.querySelectorAll('#checklistItems .checklist-item.checked');
  document.getElementById('checklistProgress').textContent = `${checked.length} / ${items.length} 完了`;
  if (!isSubmitting) document.getElementById('btnConfirmPickup').disabled = checked.length < items.length;
}

function closeChecklist() {
  document.getElementById('checklistOverlay').classList.remove('show');
  checklistParent = null;
}

// 来所：チェックリストの確定ボタンから
async function confirmPickup() {
  if (!checklistParent || isSubmitting) return;
  const parent = checklistParent;
  const btn = document.getElementById('btnConfirmPickup');
  const copy = VISIT_COPY[parent.visitType];
  isSubmitting = true; btn.disabled = true; btn.textContent = '記録中...';
  let jst;
  try {
    jst = await submitVisit(parent);
  } catch(e) {
    // 記録に失敗してもモーダルに留まり、その場でやり直せるようにする
    console.error(e);
    const err = document.getElementById('checklistError');
    err.textContent = ERROR_MESSAGE;
    err.classList.add('show');
    isSubmitting = false; btn.textContent = copy.checklistConfirm; btn.disabled = false;
    return;
  }
  isSubmitting = false; btn.textContent = copy.checklistConfirm;
  closeChecklist();
  showThanks(parent, jst);
}

// 退所：チェックリストを通さず、お迎え画面のボタンから直接記録する
async function recordDirect(parent) {
  const btn = document.getElementById('btnPickup');
  const lead = document.getElementById('actionLead');
  const label = VISIT_COPY[parent.visitType].button;
  isSubmitting = true; btn.disabled = true; btn.textContent = '記録中...';
  let jst;
  try {
    jst = await submitVisit(parent);
  } catch(e) {
    // モーダルが無いので、ボタンの上の一言をエラー表示に使う
    console.error(e);
    lead.textContent = ERROR_MESSAGE;
    lead.classList.add('is-error');
    isSubmitting = false; btn.textContent = label; btn.disabled = false;
    return;
  }
  isSubmitting = false; btn.textContent = label;
  lead.classList.remove('is-error');
  showThanks(parent, jst);
}

function capturePhoto() {
  const v = document.getElementById('video');
  const c = document.createElement('canvas'); const W=320, H=240; c.width=W; c.height=H;
  const ctx = c.getContext('2d'), s = Math.min(W/v.videoWidth, H/v.videoHeight), w=v.videoWidth*s, h=v.videoHeight*s;
  ctx.drawImage(v, (W-w)/2, (H-h)/2, w, h);
  return c.toDataURL('image/jpeg', 0.4);
}

function showThanks(parent, time) {
  if (detectionTimer) { clearInterval(detectionTimer); detectionTimer = null; }
  document.getElementById('clockScreen').style.display = 'none';
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('thanksName').textContent = parent.name + ' さん';
  document.getElementById('thanksChild').textContent = parent.childName ? `お子様：${parent.childName}` : '';
  document.getElementById('thanksPhoto').src = parent.photo || generateAvatar(parent.name);
  const copy = VISIT_COPY[parent.visitType] || VISIT_COPY.departure;
  document.querySelector('.thanks-badge').textContent = copy.thanksBadge;
  document.querySelector('.thanks-message').textContent = copy.thanksMessage;
  document.getElementById('thanksTime').textContent =
    `${parent.visitType === 'arrival' ? '来所' : '退所'}時刻：${pad(time.getHours())}:${pad(time.getMinutes())}`;
  document.getElementById('thanksScreen').style.display = 'flex';
  setTimeout(() => document.getElementById('thanksBar').style.width = '100%', 100);
  setTimeout(returnToClock, 5000);
}

async function returnToClock() {
  document.getElementById('thanksScreen').style.display = 'none';
  document.getElementById('thanksBar').style.width = '0%';
  document.getElementById('clockScreen').style.display = 'flex';
  hideProfile(); setStatus('保護者の顔をカメラに向けてください', 'detecting');
  // 読み込みに失敗しても既存データで認証を続行する（画面が止まらないように）
  try { await loadParentDescriptors(); } catch(e) { console.error(e); }
  startDetection();
}
</script>
</body>
</html>
